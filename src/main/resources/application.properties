# Nombre de la aplicacion
spring.application.name=biblioteca-backend

# ------------------------------------------------------------------
# Base de datos H2 en memoria (ideal para desarrollo y para que el
# proyecto corra "de una" sin instalar MySQL/PostgreSQL).
# Los datos se pierden al reiniciar la aplicacion.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:biblioteca_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2, util para ver las tablas mientras se prueba la API.
# Disponible en http://localhost:8080/h2-console (JDBC URL de arriba).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
# "update": crea/actualiza las tablas automaticamente segun las
# entidades. Comodo para desarrollo; en produccion se recomienda usar
# migraciones (Flyway/Liquibase) en vez de ddl-auto.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# Servidor
# ------------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
logging.level.com.biblioteca=DEBUG
